services:
  silence-rehearsal:
    build: .
    image: silence-rehearsal:1.0
    container_name: silence-rehearsal
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/sample')"]
      interval: 30s
      timeout: 5s
      retries: 3
